<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Zenith{% endblock %}</title>

    <link rel="stylesheet" href="/static/css/tailwind.css">
{% block head %}{% endblock %}
</head>

<body class="bg-zinc-950 text-white">

<div class="flex h-screen">

    <!-- Sidebar -->
    <aside class="w-64 bg-zinc-900 border-r border-zinc-800 flex flex-col">

        <div class="p-6 border-b border-zinc-800">
            <h1 class="text-3xl font-bold tracking-tight">
                Zenith
            </h1>

            <p class="text-sm text-zinc-400 mt-1">
                Productivity OS
            </p>
        </div>

        <nav class="flex-1 p-4 space-y-2">

            <a href="/" class="flex items-center gap-3 rounded-xl px-4 py-3 hover:bg-zinc-800 transition">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </a>

            <a href="/planner" class="flex items-center gap-3 rounded-xl px-4 py-3 hover:bg-zinc-800 transition">
                <i data-lucide="calendar"></i>
                <span>Planner</span>
            </a>

            <a href="#" class="flex items-center gap-3 rounded-xl px-4 py-3 hover:bg-zinc-800 transition">
                <i data-lucide="folder-kanban"></i>
                <span>Projects</span>
            </a>

            <a href="#" class="flex items-center gap-3 rounded-xl px-4 py-3 hover:bg-zinc-800 transition">
                <i data-lucide="notepad-text"></i>
                <span>Notes</span>
            </a>

            <a href="#" class="flex items-center gap-3 rounded-xl px-4 py-3 hover:bg-zinc-800 transition">
                <i data-lucide="settings"></i>
                <span>Settings</span>
            </a>

        </nav>

    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col">

        <!-- Header -->
        <header class="h-16 border-b border-zinc-800 px-8 flex items-center justify-between">

            <h2 class="text-2xl font-semibold tracking-tight">
                {% block page_title %}{% endblock %}
            </h2>

            <div class="flex items-center gap-4">

                <div class="relative">

                    <i
                        data-lucide="search"
                        class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400">
                    </i>
                    <input
                        type="text"
                        placeholder="Search..."
                        class="w-72 rounded-xl border border-zinc-700 bg-zinc-900 py-2 pl-10 pr-4 outline-none focus:border-zinc-500">

                </div>

                <button class="p-2 rounded-xl hover:bg-zinc-800 transition">
                    <i data-lucide="user-circle"></i>
                </button>

            </div>

        </header>

        <!-- Page -->
        <section class="flex-1 overflow-auto p-8">
            {% block content %}
            {% endblock %}
        </section>

    </main>

</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<script src="/static/js/vendor/fullcalendar.min.js"></script>

<script>
    lucide.createIcons();
</script>

</body>
</html>
